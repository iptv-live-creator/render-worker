name: win-selfupdate-test
on:
  workflow_dispatch:
    inputs:
      bot_url:
        description: staging bot url
        required: true
      code:
        description: one-time enroll code (single use, 1h)
        required: true
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Unit tests (Ed25519 RFC vectors, tamper/replay/bad-hash/traversal, launcher rollback)
        shell: powershell
        run: |
          python -m pip install cryptography
          python laptop\test_ed25519.py
          if ($LASTEXITCODE -ne 0) { throw 'ed25519 tests failed' }
          python laptop\test_selfupdate.py
          if ($LASTEXITCODE -ne 0) { throw 'selfupdate tests failed' }
      - name: Start.ps1 (fresh install + files + ffmpeg, no task)
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'sw'
          & .\laptop\start.ps1 -BotUrl '${{ github.event.inputs.bot_url }}' -Code '${{ github.event.inputs.code }}' -RootDir $root -NoTask
          if ($LASTEXITCODE -ne 0) { throw 'start failed' }
          Get-Content (Join-Path $root 'update_seq')
      - name: Run under launcher, expect signed update seq 2 applied, restart, healthy
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'sw'
          $py = Join-Path $root 'py\python.exe'
          $p = Start-Process $py -ArgumentList ('"' + (Join-Path $root 'launcher.py') + '" --bot ${{ github.event.inputs.bot_url }} --root "' + $root + '"') -PassThru -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 150; $i++) { Start-Sleep -Seconds 1; if (Test-Path (Join-Path $root 'worker.log')) { $l = Get-Content (Join-Path $root 'worker.log') -Raw; if ($l -match 'release 2 healthy') { $ok = $true; break } } }
          Get-Content (Join-Path $root 'worker.log')
          'update_seq=' + (Get-Content (Join-Path $root 'update_seq'))
          'worker.py tail: ' + (Get-Content (Join-Path $root 'worker.py') -Tail 1)
          Set-Content (Join-Path $root 'STOP') 'stop'
          Start-Sleep -Seconds 25
          'launcher exited: ' + $p.HasExited
          Get-Content (Join-Path $root 'worker.log') -Tail 4
          if (-not $ok) { throw 'update to seq 2 did not become healthy' }
          if ((Get-Content (Join-Path $root 'update_seq')) -ne '2') { throw 'seq not 2' }
      - name: Fixed jobs run locally (ffmpeg_test ok; nvenc_test must fail cleanly on a runner without GPU)
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'sw'
          $py = Join-Path $root 'py\python.exe'
          $code = "import sys,pathlib,json; sys.path.insert(0, r'$root'); import worker; jd=pathlib.Path(r'$root','jobs','t'); jd.mkdir(parents=True,exist_ok=True); print(json.dumps(worker.ffmpeg_test(r'$root', jd))); print(json.dumps(worker.nvenc_test(r'$root', jd))[:400])"
          & $py -c $code
          if ($LASTEXITCODE -ne 0) { throw 'job crashed' }
