name: render
on:
  workflow_dispatch:
    inputs:
      script_b64:
        description: "base64 of the scene script JSON (empty = bundled Suez sample)"
        required: false
        default: ""
      job_id:
        description: "bot job id"
        required: false
        default: ""
      callback:
        description: "bot callback URL"
        required: false
        default: ""
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-noto-ui-core
          pip install -q edge-tts shapely
      - name: geo data
        run: |
          B=https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson
          curl -sfL --retry 3 -o rivers10.json $B/ne_10m_rivers_lake_centerlines.geojson
          curl -sfL --retry 3 -o admin1.json $B/ne_10m_admin_1_states_provinces.geojson
      - name: build project
        env:
          SCRIPT_B64: ${{ inputs.script_b64 }}
        run: |
          if [ -n "$SCRIPT_B64" ]; then echo "$SCRIPT_B64" | base64 -d > script.json; else cp script_suez.json script.json; fi
          mkdir -p proj && cp template/* proj/
          if python3 -c "import json;d=json.load(open('script.json'));assert 'speaker' in d['scenes'][0] or 'countries' in d['scenes'][0]"; then python3 build2.py script.json "$PWD/proj"; else python3 build.py script.json "$PWD/proj"; fi
      - name: render
        run: |
          cd proj && npx --yes hyperframes@0.8.162 render -o ../out.mp4 --quiet
          ls -l ../out.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: out.mp4
          retention-days: 1
      - name: callback
        if: always()
        env:
          JOB_ID: ${{ inputs.job_id }}
          CALLBACK: ${{ inputs.callback }}
          STATUS: ${{ job.status }}
        run: |
          if [ -n "$CALLBACK" ] && [ -n "$JOB_ID" ]; then
            curl -s -m 30 -X POST -H 'content-type: application/json' "$CALLBACK" -d "{\"job_id\":\"$JOB_ID\",\"run_id\":\"${{ github.run_id }}\",\"status\":\"$STATUS\"}" || true
          fi
