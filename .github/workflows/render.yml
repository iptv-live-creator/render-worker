name: render
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "bot job id"
        required: false
        default: ""
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-noto-ui-core
          pip install -q edge-tts shapely
      - name: geo data
        run: |
          B=https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson
          curl -sfL --retry 3 -o rivers10.json $B/ne_10m_rivers_lake_centerlines.geojson
          curl -sfL --retry 3 -o admin1.json $B/ne_10m_admin_1_states_provinces.geojson
      - name: build project
        env:
          JOB_ID: ${{ inputs.job_id }}
          GH_RUN_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # the script and callback are fetched from the bot with this run's own token (not passed as inputs, so public run pages show neither)
          if [ -n "$JOB_ID" ] && curl -sf -m 30 --retry 3 -H "x-gh-token: $GH_RUN_TOKEN" -H "x-run-id: $RUN_ID" "https://tg-assistant-bot-hazel.vercel.app/render/script/$JOB_ID" -o bundle.json; then
            python3 -c "import json;b=json.load(open('bundle.json'));json.dump(b['script'],open('script.json','w'),ensure_ascii=False);open('callback.txt','w').write(b.get('callback',''))"
          else cp script_suez.json script.json; : > callback.txt; fi
          rm -f bundle.json
          mkdir -p proj && cp template/* proj/
          if python3 -c "import json;d=json.load(open('script.json'));assert 'speaker' in d['scenes'][0] or 'countries' in d['scenes'][0]"; then python3 build2.py script.json "$PWD/proj"; else python3 build.py script.json "$PWD/proj"; fi
      - name: render
        run: |
          cd proj && npx --yes hyperframes@0.8.162 render -o ../out.mp4 --quiet
          ls -l ../out.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: out.mp4
          retention-days: 1
      - name: callback
        if: always()
        env:
          JOB_ID: ${{ inputs.job_id }}
          STATUS: ${{ job.status }}
        run: |
          CALLBACK=$(cat callback.txt 2>/dev/null || true)
          if [ -n "$CALLBACK" ] && [ -n "$JOB_ID" ]; then
            curl -s -m 30 -X POST -H 'content-type: application/json' "$CALLBACK" -d "{\"job_id\":\"$JOB_ID\",\"run_id\":\"${{ github.run_id }}\",\"status\":\"$STATUS\"}" || true
          fi
